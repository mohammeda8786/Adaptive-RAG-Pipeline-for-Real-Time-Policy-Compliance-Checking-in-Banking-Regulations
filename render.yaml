services:
  - type: web
    name: regulamind-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_COOKIE_SECURE
        value: "1"
      - key: JWT_COOKIE_SAMESITE
        value: none
      - key: RBI_DISABLE_LLM
        value: "0"

  - type: web
    name: regulamind-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend-react/Dockerfile
    dockerContext: ./frontend-react
    envVars:
      - key: API_UPSTREAM
        value: https://regulamind-api.onrender.com

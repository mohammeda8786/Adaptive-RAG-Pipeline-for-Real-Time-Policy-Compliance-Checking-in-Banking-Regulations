services:
  - type: web
    name: regulamind-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RBI_DISABLE_LLM
        value: "0"

  - type: web
    name: regulamind-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend.Dockerfile
    dockerContext: .
    envVars:
      - key: API_UPSTREAM
        value: https://regulamind-api.onrender.com
